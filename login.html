<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Secure Portal Login</title><link rel="stylesheet" href="css/style.css"></head><body><div class="login-wrap"><div class="login-card"><div class="brand"><span class="logo">◫</span><h1>UPS DELIVERY SERVICES</h1><p>Secure Shipment Tracking Portal · CONFIDENTIAL ENVIRONMENT  </p></div><form id="loginForm" autocomplete="off"><label>Ticket Number<input type="text" id="ticket" required inputmode="numeric"></label><label>Confirmation Code<input type="text" id="code" required autocomplete="off"></label><div id="err" class="err hidden">Invalid Ticket Number or Confirmation Code.</div><button type="submit">Sign In</button></form><p class="foot">· </p></div></div><script src="js/auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const ok=await authenticate(document.getElementById('ticket').value.trim(),document.getElementById('code').value.trim());if(ok){sessionStorage.setItem('auth','1');location.href='index.html';}else{document.getElementById('err').classList.remove('hidden');}});</script></body></html>
